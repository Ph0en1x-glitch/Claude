name: flats

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (GitHub может опаздывать)
  workflow_dispatch:       # кнопка ручного запуска

permissions:
  contents: write

concurrency:
  group: flats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAST: "1"
        run: python flats.py

      - name: Save state
        run: |
          git config user.name "flats-bot"
          git config user.email "flats-bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || exit 0
          git pull --rebase
          git push
